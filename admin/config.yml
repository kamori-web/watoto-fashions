backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
    - name: "products"
    label: "Products"
    folder: "_products"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Price", name: "price", widget: "number", value_type: "float"}
            - {label: "Featured Image", name: "image", widget: "image"}
            - {label: "Category", name: "category", widget: "select", options: ["Socks", "Shoes", "Dresses", "Shorts", "T-Shirts"]}
            - {label: "Sizes", name: "sizes", widget: "list", default: ["NB", "0-3M", "3-6M"]}
            - {label: "Description", name: "body", widget: "markdown"}
